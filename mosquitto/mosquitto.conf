# ==============================================
# Mosquitto MQTT Broker — FaceGate
# ==============================================

# Listener padrão MQTT na porta 1883
listener 1883

# Listener WebSocket na porta 9001 (para clientes web, se necessário)
listener 9001
protocol websockets

# Permitir conexões sem autenticação (modo desenvolvimento)
# ⚠️  Para produção, altere para false e configure password_file
allow_anonymous true

# Persistência de mensagens
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type all
